name: Android APK Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # Monotonically increasing across this workflow so every APK is a valid Android upgrade.
      LINGUAFA_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Sanitize and validate vocabulary assets
        run: |
          python3 scripts/sanitize_vocabulary_assets.py
          python3 scripts/curated_multiword_catalog.py
          python3 scripts/curated_row_corrections.py
          python3 scripts/validate_vocabulary_quality.py

      # The e2e suite pins the content-quality invariants (no dictionary sense
      # dumps, primary senses agree with their card, POS matches the definition,
      # curated metadata present), so a data regression fails before the build.
      - name: Vocabulary end-to-end test suite
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Test, lint and build debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Verify stable signer and upgrade metadata
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"

          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-cert.txt
          grep -qi "3e87cc2a017ba41dceecde4349b7f3c92bc72cd7f3eceb7f735e371a98487806" /tmp/apk-cert.txt

          "$AAPT2" dump badging "$APK" | head -n 1 | tee /tmp/apk-badging.txt
          grep -q "name='com.aistudio.linguafa.zqkxmr'" /tmp/apk-badging.txt
          grep -q "versionCode='${LINGUAFA_VERSION_CODE}'" /tmp/apk-badging.txt

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linguafa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  review-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install compile SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Review on a 360 by 640 dp Android display
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 480
            adb shell settings put secure show_ime_with_hard_keyboard 1
            gradle --no-daemon connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/com.aistudio.linguafa.zqkxmr/files/review-ui-checks app/build/review-ui-checks
      - name: Upload UI reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-ui-verification
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/review-ui-checks
          retention-days: 14
