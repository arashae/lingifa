name: Build Offline Vocabulary Bundle

on:
  push:
    branches: [main]
    paths:
      - scripts/build_vocabulary_assets.py
      - .github/workflows/vocabulary-bundle.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Generate IELTS, TOEFL and GRE offline assets
        run: python scripts/build_vocabulary_assets.py

      - name: Show generated coverage
        run: |
          cat app/src/main/assets/vocabulary/coverage_report.json
          git diff --stat

      - name: Commit generated vocabulary into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/vocabulary
          if git diff --cached --quiet; then
            echo "Vocabulary assets are already up to date."
          else
            git commit -m "data: bundle complete offline IELTS TOEFL GRE vocabulary"
            git push origin HEAD:main
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Test vocabulary importer and build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace

      - name: Prepare installable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LinguaFa-offline-vocabulary.apk

      - name: Upload installable APK and coverage report
        uses: actions/upload-artifact@v4
        with:
          name: linguafa-offline-vocabulary-apk
          path: |
            LinguaFa-offline-vocabulary.apk
            app/src/main/assets/vocabulary/coverage_report.json
          if-no-files-found: error
          retention-days: 14
